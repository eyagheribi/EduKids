services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: edukids-rabbitmq
    hostname: edukids-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edukids}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edukids_dev_2026}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq_data:
